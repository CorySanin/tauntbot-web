name: App Image CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master


jobs:
  build_app_image:
    name: Build app image
    runs-on: ubuntu-latest
    env:
      DH_REGISTRY: docker.io
      GH_REGISTRY: ghcr.io
      GT_REGISTRY: git.sanin.dev
      IMAGE_NAME: ${{ github.repository }}
      REPOSITORY: ${{ github.event.repository.name }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Login to gitea registry
        if: ${{ env.GITHUB_SERVER_URL == 'https://git.sanin.dev' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GT_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GT_PAT }}

      - name: Login to GitHub Container Registry
        if: ${{ env.GITHUB_SERVER_URL == 'https://github.com' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set target platforms
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: echo "DPLATFORMS=linux/amd64" >> $GITHUB_ENV
      
      - name: Set target platforms (release)
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: echo "DPLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
      
      - name: Define image name patterns
        run: |
          {
            echo "PIMAGES<<EOF"
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "${{ env.DOCKER_USERNAME }}/${{ env.REPOSITORY }}"
            fi
            if [ "${{ env.GITHUB_SERVER_URL == 'https://git.sanin.dev' }}" = "true" ]; then
              echo "${{ env.GT_REGISTRY }}/${{ env.IMAGE_NAME }}"
            elif [ "${{ env.GITHUB_SERVER_URL == 'https://github.com' }}" = "true" ]; then
              echo "${{ env.GH_REGISTRY }}/${{ env.IMAGE_NAME }}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      - name: Define release tag patterns
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: |
          {
            echo "PTAGS<<EOF"
            echo "type=raw,value=latest"
            echo "type=semver,pattern={{version}}"
            echo "type=semver,pattern={{major}}.{{minor}}"
            echo "type=semver,pattern={{major}}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      - name: Define develop tag patterns
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          {
            echo "PTAGS<<EOF"
            echo "type=ref,event=branch"
            echo "type=ref,event=pr"
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PIMAGES }}
          tags: ${{ env.PTAGS }}
          labels: |
            org.opencontainers.image.title=nodejs-web-template
            org.opencontainers.image.description=Template for my nodejs web projects
            org.opencontainers.image.authors=Cory Sanin <corysanin@outlook.com>
            org.opencontainers.image.url=https://sanin.dev/
            org.opencontainers.image.documentation=https://git.sanin.dev/corysanin/nodejs-web-template#readme
            org.opencontainers.image.source=https://git.sanin.dev/corysanin/nodejs-web-template
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{ date 'YYYY-MM-DD[T]HH:mm:ss[Z]' }}
          annotations: |
            index:org.opencontainers.image.title=nodejs-web-template
            index:org.opencontainers.image.description=Template for my nodejs web projects
            index:org.opencontainers.image.authors=Cory Sanin <corysanin@outlook.com>
            index:org.opencontainers.image.url=https://sanin.dev/
            index:org.opencontainers.image.documentation=https://git.sanin.dev/corysanin/nodejs-web-template#readme
            index:org.opencontainers.image.source=https://git.sanin.dev/corysanin/nodejs-web-template
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.version=${{ github.ref_name }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.created={{ date 'YYYY-MM-DD[T]HH:mm:ss[Z]' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          target: deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.DPLATFORMS }}
